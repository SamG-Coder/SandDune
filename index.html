<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b49a76" />
    <meta
      name="description"
      content="Interactive sand in a glass box: dig, pour and smooth the surface while wind moves sand and gravity settles the slopes."
    />
    <title>Sand</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <main id="world" aria-label="Interactive sand">
      <div id="loading" role="status">Loading sand…</div>
      <div id="error" role="alert" hidden></div>
      <div class="interface tools" role="group" aria-label="Sand tools">
        <button
          data-tool="dig"
          aria-pressed="true"
          title="Dig and push sand to the edges (1)"
        >
          Dig</button
        ><button data-tool="pour" aria-pressed="false" title="Pour sand (2)">
          Pour</button
        ><button
          data-tool="smooth"
          aria-pressed="false"
          title="Smooth sand (3)"
        >
          Smooth</button
        ><button data-tool="water" aria-pressed="false" title="Pour water (5)">
          Water</button
        ><button data-tool="orbit" aria-pressed="false" title="Move camera (4)">
          Orbit</button
        ><span class="separator"></span><label for="brush">Size</label
        ><input
          id="brush"
          type="range"
          min="1.2"
          max="8"
          step="0.2"
          value="3.2"
          aria-label="Brush size"
        /><span id="tap-controls" hidden
          ><label for="tap-flow">Tap flow</label>
          <input
            id="tap-flow"
            type="range"
            min="0"
            max="3"
            step="0.1"
            value="1"
            aria-label="Tap flow"
          />
          <output id="tap-flow-value">100%</output></span
        ><button id="clear" title="Reset sand and water">Reset sand</button>
      </div>
      <details class="interface conditions">
        <summary>Wind &amp; light</summary>
        <div class="settings">
          <label for="wind">Wind <output id="wind-value">12 km/h</output></label
          ><input
            id="wind"
            type="range"
            min="0"
            max="40"
            step="1"
            value="12"
          /><label for="direction"
            >Direction <output id="direction-value">65°</output></label
          ><input
            id="direction"
            type="range"
            min="0"
            max="360"
            step="1"
            value="65"
          /><label for="sun">Sun <output id="sun-value">24°</output></label
          ><input
            id="sun"
            type="range"
            min="4"
            max="75"
            step="1"
            value="24"
          /><label for="quality"
            >Quality<select id="quality">
              <option value="auto">Adaptive</option>
              <option value="low">Low</option>
              <option value="medium">Balanced</option>
              <option value="high">High</option>
            </select></label
          >
          <div class="actions">
            <button id="pause" aria-pressed="false">Pause</button
            ><button id="reset">Reset view</button>
          </div>
        </div>
      </details>
      <div class="interface help" id="hint">
        Drag to move sand · Right-drag to orbit · Scroll to zoom
      </div>
      <div class="interface performance">
        <span id="stats"></span
        ><button
          id="hide-ui"
          title="Hide controls (H)"
          aria-label="Hide controls"
        >
          ×
        </button>
      </div>
      <button id="show-ui" hidden>Controls</button>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
